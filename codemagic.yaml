workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.grost9999.marinademaster
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.grost9999.marinademaster
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa --project ios/MarinadeMaster.xcodeproj --scheme MarinadeMaster
    artifacts:
      - build/ios/ipa/*.ipa
