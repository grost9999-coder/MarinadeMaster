<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17372b"><link rel="manifest" href="manifest.webmanifest"><title>醃製配方管理師</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#183328;background:#f3f6f3}*{box-sizing:border-box}body{margin:0}header{background:#17372b;color:white;padding:22px max(18px,calc((100% - 1050px)/2))}header b{font-size:22px}header small{display:block;color:#c2d6c9;margin-top:4px}main{max-width:1050px;margin:20px auto;padding:0 14px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:15px}.tabs button,button{border:0;border-radius:10px;padding:11px 14px;font-weight:650;background:#e5eee8;color:#17372b;cursor:pointer;white-space:nowrap}.tabs .on,button.primary{background:#176b4a;color:white}.panel{background:white;border:1px solid #e0e8e2;border-radius:16px;padding:17px;margin:12px 0}.hide{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#edf4ef;border-radius:13px;padding:14px}.stat strong{display:block;font-size:25px}.muted{color:#728178;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}input,select,textarea{font:inherit;padding:10px;border:1px solid #d5e0d8;border-radius:9px;max-width:100%}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}td,th{text-align:left;border-bottom:1px solid #e4ebe6;padding:9px 6px}.tag{background:#e1f2e7;color:#176b4a;padding:4px 8px;border-radius:30px;font-size:12px}.warn{background:#fff7e8;padding:12px;border-radius:10px;font-size:13px}.group{font-weight:750;color:#176b4a;margin-top:15px}.recipe{border:1px solid #e2eae4;border-radius:12px;padding:13px;margin:9px 0}.editor-group{border:1px solid #dce7df;border-radius:12px;padding:12px;margin:12px 0}.ingredient-row{display:grid;grid-template-columns:minmax(110px,1fr) 100px 75px auto;gap:7px;align-items:center;margin:7px 0}.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:9px;margin:10px 0}.photo-card img{width:100%;height:110px;object-fit:cover;border-radius:9px}.photo-card button{margin-top:4px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{font-size:13px}.stage{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #e4ebe6}.good{color:#176b4a}.bad{color:#a64b24}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}main{margin:12px auto}.panel{padding:13px}}
</style></head><body><header><b>醃製配方管理師</b><small>MARINADE MASTER · 配方研發／生產／成本</small></header><main>
<nav class="tabs"><button class="on" data-p="home">總覽</button><button data-p="recipes">配方中心</button><button data-p="calc">重量換算</button><button data-p="batches">生產批次</button><button data-p="stock">原料庫存</button><button data-p="versions">版本／成本</button><button data-p="backup">報表備份</button></nav>
<section id="home"><div class="stats"><div class="stat">配方版本<strong id="nr">2</strong></div><div class="stat">生產批次<strong id="nb">0</strong></div><div class="stat">原料品項<strong id="ns">0</strong></div></div><div class="panel"><h3>資料保護規則</h3><p class="warn">歷史原始配方不覆寫；修改另存版本。批次固定保存配方快照。缺少單價或資料時標記待補，不自行推測。目前資料儲存在此瀏覽器，尚未雲端同步。</p><div id="latest" class="muted">尚無生產紀錄</div></div></section>
<section id="recipes" class="hide"><div class="row"><h3>配方中心</h3><button class="primary" id="newRecipe">新增配方</button></div><div id="recipeList"></div><div id="recipeView"></div><div id="recipeEditor" class="panel hide"></div></section>
<section id="calc" class="hide"><div class="panel"><h3>重量換算</h3><label>配方</label><select id="which"></select><label>雞肉重量（kg）</label><input id="kg" type="number" min=".001" step=".001" value="18"><div id="calcOut"></div><button class="primary" id="toBatch">建立生產批次</button></div></section>
<section id="batches" class="hide"><div class="row"><h3>生產批次</h3><button class="primary" id="newBatch">快速建立批次</button></div><div id="batchList"></div><input id="batchPhotoInput" type="file" accept="image/*" capture="environment" hidden></section>
<section id="stock" class="hide"><div class="row"><h3>原料庫存</h3><div class="actions"><button id="addStock">新增原料</button><button class="primary" id="purchaseStock">新增進貨</button></div></div><div class="panel" id="stockList"></div><div class="panel"><h3>採購價格歷史</h3><div id="purchaseHistory"></div></div><p class="muted">庫存單位固定為 g 或 kg。進貨時必須使用相同單位；庫存成本採加權平均法，歷史採購單價逐筆保留。</p></section>
<section id="versions" class="hide"><div class="panel"><h3>配方版本比較</h3><div class="row"><select id="vA"></select><select id="vB"></select><button class="primary" id="compare">比較差異</button></div><div id="diffOut"></div></div><div class="panel"><h3>批次成本分析</h3><div id="costOut"></div></div><div class="panel"><h3>庫存異動紀錄</h3><div id="ledgerOut"></div></div></section>
<section id="backup" class="hide"><div class="panel"><h3>生產批次報表</h3><select id="report"></select> <button class="primary" id="pdf">列印／另存 PDF</button></div><div class="panel"><h3>資料備份</h3><button class="primary" id="export">匯出 JSON</button><label>匯入 JSON<input id="import" type="file" accept=".json,application/json"></label></div></section>
</main><script src="inventory-core.js"></script><script>
const original=[
{id:'R001',name:'紅麴豆乳雞－甜菜根粉版',version:'歷史紀錄／18kg基準',base:18,groups:[{name:'濕料',items:[['紅麴豆腐乳',200,'g'],['醬油',15,'g'],['米酒',105,'g'],['沙拉油',36,'g'],['醋',5,'g']]},{name:'乾料／粉漿',items:[['豆漿粉',60,'g'],['蒜粉',53,'g'],['砂糖',45,'g'],['白胡椒',18,'g'],['甜菜根粉',5,'g'],['磷酸鈉或林寶粉',5,'g'],['中筋麵粉',150,'g'],['地瓜粉',450,'g'],['玉米粉',300,'g'],['冰水',180,'g'],['CMC',1.8,'g']]}],note:'最新18kg摘要；「磷酸鈉5g或林寶粉」保留原始歧義。'},
{id:'R002',name:'檸檬雞－熟黃豆粉版',version:'2026-10-05原始紀錄',base:17,groups:[{name:'醃料（未加水）',items:[['米酒',255,'g'],['醬油',50,'g'],['檸檬酸',51,'g'],['砂糖',204,'g'],['鹽',136,'g'],['熟黃豆粉',60,'g'],['蒜粉',51,'g'],['白胡椒粉',17,'g']]}],note:'原始紀錄明確註記：醃料階段沒有加水。每17kg翅腿。'}
];
let db=JSON.parse(localStorage.getItem('mmdb')||'null')||{recipes:original,batches:[],stock:[],ledger:[],purchases:[]};db.ledger=db.ledger||[];db.purchases=db.purchases||[];db.stock.forEach(x=>{if(!Number.isFinite(+x.qty))x.qty=0;if(!Number.isFinite(+x.price))x.price=0});let calc=null;
const $=id=>document.getElementById(id),save=()=>{try{localStorage.setItem('mmdb',JSON.stringify(db))}catch(e){alert('儲存空間不足。請先匯出 JSON 備份，並減少批次照片數量或改用雲端儲存。');return}render()},fmt=n=>Number(n.toFixed(4)),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelector('.tabs').onclick=e=>{let b=e.target.closest('[data-p]');if(!b)return;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('main section').forEach(x=>x.classList.toggle('hide',x.id!==b.dataset.p));};
function itemsOf(r){return r.groups.flatMap(g=>g.items.map(x=>({name:x[0],qty:+x[1],unit:x[2]})))}
function unitQty(q,from,to){return InventoryCore.toUnit(q,from,to)}
function costOf(b,snapshot){return InventoryCore.calculateCost(b.groups,db.stock,snapshot||b.costSnapshot||null)}
function render(){
$('nr').textContent=db.recipes.length;$('nb').textContent=db.batches.length;$('ns').textContent=db.stock.length;$('latest').textContent=db.batches.length?'最近批次：'+db.batches[db.batches.length-1].code+'／'+db.batches[db.batches.length-1].status:'尚無生產紀錄';
$('recipeList').innerHTML=db.recipes.map((r,i)=>'<div class="recipe"><b>'+esc(r.name)+'</b> <span class="tag">'+esc(r.version)+'</span><p class="muted">基準 '+r.base+'kg</p><div class="actions"><button onclick="viewRecipe('+i+')">查看配方</button><button onclick="openRecipeEditor('+i+')">編輯（另存新版本）</button><button onclick="cloneRecipe('+i+')">快速複製</button></div></div>').join('');
$('which').innerHTML=db.recipes.map(r=>'<option value="'+r.id+'">'+esc(r.name)+'｜'+esc(r.version)+'</option>').join('');$('vA').innerHTML=$('which').innerHTML;$('vB').innerHTML=$('which').innerHTML;
$('stockList').innerHTML=db.stock.length?'<table><tr><th>原料</th><th>庫存量</th><th>單位</th><th>加權平均成本</th></tr>'+db.stock.map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+fmt(s.qty)+'</td><td>'+s.unit+'</td><td>$'+fmt(s.price)+'</td></tr>').join('')+'</table>':'<p class="muted">尚無原料庫存</p>';$('purchaseHistory').innerHTML=db.purchases.length?'<table><tr><th>日期</th><th>原料</th><th>數量</th><th>單價</th><th>供應商</th></tr>'+db.purchases.slice().reverse().map(p=>'<tr><td>'+esc(p.date)+'</td><td>'+esc(p.name)+'</td><td>'+p.qty+' '+p.unit+'</td><td>$'+p.unitPrice+'</td><td>'+esc(p.supplier||'')+'</td></tr>').join('')+'</table>':'<p class="muted">尚無進貨紀錄</p>';
$('batchList').innerHTML=db.batches.map(b=>{let p=b.process||{};return '<div class="recipe"><b>'+esc(b.code)+'</b><p class="muted">'+esc(b.name)+'／'+b.kg+'kg／'+esc(b.status)+'</p><p class="muted">配方快照：'+esc(b.version)+'；建立：'+esc(b.date)+'</p><div class="actions"><button onclick="recordStage(\''+b.id+'\',\'退冰\')">記錄退冰</button><button onclick="recordStage(\''+b.id+'\',\'醃製\')">記錄醃製</button><button onclick="recordStage(\''+b.id+'\',\'裹粉\')">記錄裹粉</button><button onclick="recordStage(\''+b.id+'\',\'完成\')">記錄完成</button><button onclick="finishBatch(\''+b.id+'\')">完成批次／扣庫存</button><button onclick="batchPDF(\''+b.id+'\')">批次報表</button><button onclick="pickBatchPhoto(\''+b.id+'\')">新增照片</button><button onclick="showBatchPhotos(\''+b.id+'\')">查看照片</button></div><p class="muted">'+['退冰','醃製','裹粉','完成'].map(k=>k+'：'+(p[k]||'未記錄')).join('　｜　')+'</p></div>'}).join('')||'<p class="muted">尚無批次</p>';
$('report').innerHTML=db.batches.map(b=>'<option value="'+b.id+'">'+esc(b.code)+'</option>').join('');
$('costOut').innerHTML=db.batches.map(b=>{let z=b.cost||costOf(b);return '<div class="recipe"><b>'+esc(b.code)+'</b><p>'+(z.complete?'原料成本：$'+z.total.toFixed(2)+'；每公斤：$'+(z.total/b.kg).toFixed(2):'成本資料待補：'+z.missing.map(esc).join('、'))+'</p><button onclick="recalcCost(\''+b.id+'\')">重新計算</button></div>'}).join('')||'<p class="muted">尚無批次</p>';
$('ledgerOut').innerHTML=db.ledger.length?'<table><tr><th>時間</th><th>批次</th><th>原料</th><th>異動</th><th>餘額</th></tr>'+db.ledger.slice().reverse().map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.batch)+'</td><td>'+esc(x.name)+'</td><td>'+x.delta+' '+x.unit+'</td><td>'+x.balance+'</td></tr>').join('')+'</table>':'<p class="muted">尚無異動紀錄</p>';
calculate();
}
window.viewRecipe=i=>{let r=db.recipes[i];$('recipeView').innerHTML='<div class="panel"><h3>'+esc(r.name)+'｜'+esc(r.version)+'</h3>'+r.groups.map(g=>'<div class="group">'+esc(g.name)+'</div><table>'+g.items.map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+x[1]+' '+x[2]+'</td></tr>').join('')+'</table>').join('')+'<p class="warn">'+esc(r.note||'')+'</p></div>'};
window.cloneRecipe=i=>{let r=JSON.parse(JSON.stringify(db.recipes[i]));r.id='R'+Date.now();r.version='v'+(db.recipes.filter(x=>x.name===r.name).length+1)+'（複製版本）';r.name=r.name.replace(/（新版本）$/,'');db.recipes.push(r);save()};
$('newRecipe').onclick=()=>openRecipeEditor(null);

let recipeDraft=null;
window.openRecipeEditor=index=>{
 const source=index===null?{id:'',name:'',version:'v1',base:18,groups:[{name:'原料',items:[['',0,'g']]}],note:''}:JSON.parse(JSON.stringify(db.recipes[index]));
 if(index!==null){const same=db.recipes.filter(x=>x.name===source.name).length;source.basedOnId=source.id;source.id='';source.version='v'+(same+1)+'（編輯另存）'}
 recipeDraft=source;renderRecipeEditor();
};
function renderRecipeEditor(){
 const root=$('recipeEditor');root.classList.remove('hide');
 root.innerHTML='<div class="row"><h3>配方編輯器</h3><button onclick="$(\'recipeEditor\').classList.add(\'hide\')">收起</button></div><p class="warn">儲存時一律建立新配方版本，不會覆蓋任何歷史配方或既有批次快照。</p><label>配方名稱</label><input id="draftName" style="width:100%" value="'+esc(recipeDraft.name)+'"><label>版本名稱</label><input id="draftVersion" style="width:100%" value="'+esc(recipeDraft.version)+'"><label>雞肉基準重量（kg）</label><input id="draftBase" type="number" min="0.001" step="0.001" value="'+recipeDraft.base+'"><label>備註</label><textarea id="draftNote" style="width:100%" rows="2">'+esc(recipeDraft.note||'')+'</textarea>'+recipeDraft.groups.map((g,gi)=>'<div class="editor-group"><div class="row"><b>原料群組 '+(gi+1)+'</b><button onclick="removeDraftGroup('+gi+')">刪除群組</button></div><label>群組名稱</label><input data-group-name="'+gi+'" style="width:100%" value="'+esc(g.name)+'">'+g.items.map((it,ii)=>'<div class="ingredient-row"><input data-item-name="'+gi+'-'+ii+'" placeholder="原料名稱" value="'+esc(it[0])+'"><input data-item-qty="'+gi+'-'+ii+'" type="number" min="0" step="0.001" placeholder="用量" value="'+it[1]+'"><select data-item-unit="'+gi+'-'+ii+'"><option value="g" '+(it[2]==='g'?'selected':'')+'>g</option><option value="kg" '+(it[2]==='kg'?'selected':'')+'>kg</option></select><button onclick="removeDraftItem('+gi+','+ii+')">刪除</button></div>').join('')+'<button onclick="addDraftItem('+gi+')">＋新增原料</button></div>').join('')+'<div class="actions"><button onclick="addDraftGroup()">＋新增原料群組</button><button class="primary" onclick="saveRecipeDraft()">儲存新版本</button></div>';
}
window.addDraftGroup=()=>{recipeDraft.groups.push({name:'新群組',items:[]});renderRecipeEditor()};
window.removeDraftGroup=i=>{if(!confirm('確定刪除此原料群組？'))return;recipeDraft.groups.splice(i,1);renderRecipeEditor()};
window.addDraftItem=i=>{recipeDraft.groups[i].items.push(['',0,'g']);renderRecipeEditor()};
window.removeDraftItem=(g,i)=>{recipeDraft.groups[g].items.splice(i,1);renderRecipeEditor()};
window.saveRecipeDraft=()=>{
 const name=$('draftName').value.trim(),version=$('draftVersion').value.trim(),base=+$('draftBase').value,note=$('draftNote').value;
 if(!name||!version||!(base>0))return alert('請填寫配方名稱、版本及大於 0 的基準重量。');
 const groups=recipeDraft.groups.map((g,gi)=>({name:document.querySelector('[data-group-name="'+gi+'"]').value.trim(),items:g.items.map((it,ii)=>{const key=gi+'-'+ii;return [document.querySelector('[data-item-name="'+key+'"]').value.trim(),+document.querySelector('[data-item-qty="'+key+'"]').value,document.querySelector('[data-item-unit="'+key+'"]').value]})}));
 if(!groups.length)return alert('至少需要一個原料群組。');
 for(const g of groups){if(!g.name)return alert('原料群組名稱不可空白。');for(const it of g.items){if(!it[0]||!(it[1]>0)||!['g','kg'].includes(it[2]))return alert('每筆原料都要有名稱、正數用量及 g／kg 單位。')}}
 db.recipes.push({id:'R'+Date.now(),name,version,base,groups,note,createdAt:new Date().toISOString(),basedOn:recipeDraft.basedOnId||recipeDraft.id||null});
 recipeDraft=null;save();$('recipeEditor').classList.add('hide');alert('已另存為新配方版本，原始配方保持不變。');
};
let selectedPhotoBatch=null;
window.pickBatchPhoto=id=>{selectedPhotoBatch=id;$('batchPhotoInput').value='';$('batchPhotoInput').click()};
$('batchPhotoInput').onchange=e=>{
 const file=e.target.files&&e.target.files[0];if(!file||!selectedPhotoBatch)return;
 if(!file.type.startsWith('image/'))return alert('請選擇圖片檔。');
 const reader=new FileReader();reader.onload=()=>{
  const img=new Image();img.onload=()=>{
   const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');
   canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
   canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
   const data=canvas.toDataURL('image/jpeg',0.68);
   if(data.length>1500000)return alert('照片壓縮後仍過大，請改選較小的照片。');
   const b=db.batches.find(x=>x.id===selectedPhotoBatch);if(!b)return;
   const caption=prompt('照片備註（例如：醃製完成、裹粉狀態）','生產照片');if(caption===null)return;
   b.photos=b.photos||[];b.photos.push({data,caption,createdAt:new Date().toLocaleString('zh-TW',{hour12:false}),mime:'image/jpeg'});save();
  };img.onerror=()=>alert('無法讀取這張照片。');img.src=reader.result;
 };reader.readAsDataURL(file);
};

window.showBatchPhotos=id=>{
 const b=db.batches.find(x=>x.id===id),photos=b&&b.photos||[];
 if(!photos.length)return alert('此批次尚未新增照片。');
 const w=window.open('','_blank');if(!w)return alert('請允許開啟彈出視窗。');
 w.document.write('<meta charset="utf-8"><title>'+esc(b.code)+' 生產照片</title><h2>'+esc(b.code)+'｜生產照片（'+photos.length+'張）</h2>'+photos.map(ph=>'<figure><img style="max-width:100%;max-height:70vh" src="'+ph.data+'"><figcaption>'+esc(ph.caption||'生產照片')+'｜'+esc(ph.createdAt||'')+'</figcaption></figure>').join(''));
 w.document.close();
};
window.deleteBatchPhoto=(id,index)=>{const b=db.batches.find(x=>x.id===id);if(!b||!b.photos)return;if(!confirm('確定刪除這張批次照片？'))return;b.photos.splice(index,1);save()};

function calculate(){let r=db.recipes.find(x=>x.id===$('which').value),kg=+$('kg').value;if(!r||!(kg>0))return;calc={r,kg,groups:r.groups.map(g=>({name:g.name,items:g.items.map(x=>[x[0],x[1]*kg/r.base,x[2]])}))};$('calcOut').innerHTML='<p class="muted">換算倍率 '+(kg/r.base).toFixed(6)+' 倍；不修改原始配方。</p>'+calc.groups.map(g=>'<div class="group">'+esc(g.name)+'</div><table>'+g.items.map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+fmt(x[1])+' '+x[2]+'</td></tr>').join('')+'</table>').join('')}
$('kg').oninput=calculate;$('which').onchange=calculate;
function createBatch(){if(!calc)return;let b={id:'B'+Date.now(),code:'MM-'+Date.now(),name:calc.r.name,version:calc.r.version,recipeId:calc.r.id,recipeSnapshot:JSON.parse(JSON.stringify(calc.r)),kg:calc.kg,groups:JSON.parse(JSON.stringify(calc.groups)),status:'準備中',date:new Date().toISOString().slice(0,10),createdAt:new Date().toISOString(),process:{},cost:null};db.batches.push(b);save();alert('已建立批次 '+b.code)}
$('toBatch').onclick=createBatch;$('newBatch').onclick=()=>{let r=db.recipes[0],kg=+prompt('雞肉重量 kg',r.base);if(!(kg>0))return;calc={r,kg,groups:r.groups.map(g=>({name:g.name,items:g.items.map(x=>[x[0],x[1]*kg/r.base,x[2]])}))};createBatch()};
$('addStock').onclick=()=>{let name=prompt('原料名稱');if(!name)return;name=name.trim();if(db.stock.some(x=>x.name===name))return alert('原料已存在，請使用新增進貨');let unit=prompt('庫存單位 g 或 kg','kg');if(!['g','kg'].includes(unit))return alert('單位請輸入 g 或 kg');db.stock.push({name,unit,qty:0,price:0});save()};
$('purchaseStock').onclick=()=>{if(!db.stock.length)return alert('請先新增原料');let name=prompt('選擇原料名稱：'+db.stock.map(x=>x.name+'（'+x.unit+'）').join('、'));if(!name)return;let stock=db.stock.find(x=>x.name===name.trim());if(!stock)return alert('找不到這項原料');let qty=+prompt('進貨數量（'+stock.unit+'）','0');if(!(qty>0))return alert('進貨數量必須大於 0');let unitPrice=+prompt('單價（元／'+stock.unit+'）','0');if(!Number.isFinite(unitPrice)||unitPrice<0)return alert('單價不可為負數');let supplier=prompt('供應商（選填）','')||'';let purchase={id:'P'+Date.now(),date:new Date().toISOString().slice(0,10),name,unit:stock.unit,qty,unitPrice,supplier,previousQty:stock.qty,previousAverage:stock.price};try{InventoryCore.applyPurchase(db.stock,purchase)}catch(e){return alert(e.message)}db.purchases.push(purchase);db.ledger.push({date:new Date().toISOString(),type:'進貨',batch:supplier||'進貨',name,delta:qty,balance:stock.qty,unit:stock.unit,unitPrice});save()};
window.recordStage=(id,stage)=>{let b=db.batches.find(x=>x.id===id);if(!b.process)b.process={};if(b.process[stage])return alert('此階段已記錄：'+b.process[stage]);b.process[stage]=new Date().toLocaleString('zh-TW',{hour12:false});save()};
window.finishBatch=id=>{let b=db.batches.find(x=>x.id===id);if(!b)return;if(b.status==='已完成'||b.stockDeductedAt)return alert('此批次已完成扣料，不會重複扣料');let needs=[];b.groups.forEach(g=>g.items.forEach(x=>{let st=db.stock.find(y=>y.name===x[0]),q=st?unitQty(x[1],x[2],st.unit):null;if(!st||q===null||st.qty+1e-9<q)needs.push(x[0])}));if(needs.length)return alert('庫存不足或缺少原料：'+[...new Set(needs)].join('、'));b.costSnapshot=InventoryCore.captureCosts(b.groups,db.stock);b.cost=costOf(b,b.costSnapshot);b.groups.forEach(g=>g.items.forEach(x=>{let st=InventoryCore.consumeStock(db.stock,x[0],x[1],x[2]);db.ledger.push({date:new Date().toISOString(),type:'生產耗用',batch:b.code,name:st.name,delta:-unitQty(x[1],x[2],st.unit),balance:st.qty,unit:st.unit})}));b.status='已完成';b.completedAt=new Date().toISOString();b.stockDeductedAt=b.completedAt;save()};
window.recalcCost=id=>{let b=db.batches.find(x=>x.id===id);if(b.status==='已完成'&&b.costSnapshot)return alert('此批次已保存生產當時成本快照，不會以目前單價覆蓋歷史成本。');b.cost=costOf(b);b.costSnapshot=InventoryCore.captureCosts(b.groups,db.stock);save();alert(b.cost.complete?'目前估算原料成本 $'+b.cost.total.toFixed(2):'成本待補：'+b.cost.missing.join('、'))};
$('compare').onclick=()=>{let a=db.recipes.find(x=>x.id===$('vA').value),b=db.recipes.find(x=>x.id===$('vB').value);if(!a||!b)return;let A=new Map(itemsOf(a).map(x=>[x.name,x])),B=new Map(itemsOf(b).map(x=>[x.name,x])),names=[...new Set([...A.keys(),...B.keys()])];$('diffOut').innerHTML='<table><tr><th>原料</th><th>A 版</th><th>B 版</th><th>差異</th></tr>'+names.map(n=>{let x=A.get(n),y=B.get(n);return '<tr><td>'+esc(n)+'</td><td>'+(x?x.qty+' '+x.unit:'無')+'</td><td>'+(y?y.qty+' '+y.unit:'無')+'</td><td>'+(x&&y?(x.unit===y.unit?(y.qty-x.qty).toFixed(4)+' '+x.unit:'單位不同'):(x?'B 版刪除':'B 版新增'))+'</td></tr>'}).join('')+'</table><p class="muted">顯示各版本基準配方用量；若基準雞肉重量不同，請換算到相同重量再比較。</p>'};
function batchPDF(id){let b=db.batches.find(x=>x.id===id),w=window.open('','_blank');if(!w)return alert('請允許開啟彈出視窗');w.document.write('<meta charset="utf-8"><h2>醃製生產批次報表</h2><p>'+esc(b.code)+'｜'+esc(b.date)+'｜'+esc(b.name)+'｜'+b.kg+'kg</p><p>配方版本：'+esc(b.version)+'</p>'+b.groups.map(g=>'<h3>'+esc(g.name)+'</h3><table border="1" cellpadding="7">'+g.items.map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+fmt(x[1])+' '+x[2]+'</td></tr>').join('')+'</table>').join('')+'<h3>製程時間</h3><p>'+['退冰','醃製','裹粉','完成'].map(k=>k+'：'+((b.process||{})[k]||'未記錄')).join('<br>')+'</p><p>成本：'+(b.cost&&b.cost.complete?'$'+b.cost.total.toFixed(2):'待補')+'</p><script>onload=()=>print()<\\/script>');w.document.close()}
$('pdf').onclick=()=>{if(!$('report').value)return alert('尚無批次');batchPDF($('report').value)};
$('export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='MarinadeMaster-backup.json';a.click();URL.revokeObjectURL(u)};
$('import').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!x.recipes||!x.batches||!x.stock)throw 0;if(confirm('匯入會取代目前資料，確定？')){db=x;db.ledger=db.ledger||[];save()}}catch{alert('備份檔格式錯誤')}};rd.readAsText(f)};
render();
</script></body></html>
