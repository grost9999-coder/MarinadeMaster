<!doctype html><n<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17372b"><link rel="manifest" href="manifest.webmanifest"><title>醃製配方管理師</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#183328;background:#f3f6f3}*{box-sizing:border-box}body{margin:0}header{background:#17372b;color:white;padding:22px max(18px,calc((100% - 1050px)/2))}header b{font-size:22px}header small{display:block;color:#c2d6c9;margin-top:4px}main{max-width:1050px;margin:20px auto;padding:0 14px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:15px}.tabs button,button{border:0;border-radius:10px;padding:11px 14px;font-weight:650;background:#e5eee8;color:#17372b;cursor:pointer;white-space:nowrap}.tabs .on,button.primary{background:#176b4a;color:white}.panel{background:white;border:1px solid #e0e8e2;border-radius:16px;padding:17px;margin:12px 0}.hide{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#edf4ef;border-radius:13px;padding:14px}.stat strong{display:block;font-size:25px}.muted{color:#728178;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}input,select,textarea{font:inherit;padding:10px;border:1px solid #d5e0d8;border-radius:9px;max-width:100%}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}td,th{text-align:left;border-bottom:1px solid #e4ebe6;padding:9px 6px}.tag{background:#e1f2e7;color:#176b4a;padding:4px 8px;border-radius:30px;font-size:12px}.warn{background:#fff7e8;padding:12px;border-radius:10px;font-size:13px}.group{font-weight:750;color:#176b4a;margin-top:15px}.recipe{border:1px solid #e2eae4;border-radius:12px;padding:13px;margin:9px 0}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}main{margin:12px auto}.panel{padding:13px}}
</style></head><body><header><b>醃製配方管理師</b><small>MARINADE MASTER · 配方研發／生產／成本</small></header><main>
<nav class="tabs"><button class="on" data-p="home">總覽</button><button data-p="recipes">配方中心</button><button data-p="calc">重量換算</button><button data-p="batches">生產批次</button><button data-p="stock">原料庫存</button><button data-p="backup">報表備份</button></nav>
<section id="home"><div class="stats"><div class="stat">配方版本<strong id="nr">2</strong></div><div class="stat">生產批次<strong id="nb">0</strong></div><div class="stat">原料品項<strong id="ns">0</strong></div></div><div class="panel"><h3>資料保護規則</h3><p class="warn">歷史原始配方不覆寫；修改另存版本。批次固定保留配方快照。未取得數據標記待補，不自行推測。此 MVP 資料儲存在目前瀏覽器，尚未雲端同步。</p><div id="latest" class="muted">尚無生產紀錄</div></div></section>
<section id="recipes" class="hide"><div class="row"><h3>配方中心</h3><button class="primary" id="newRecipe">新增配方</button></div><div id="recipeList"></div><div id="recipeView"></div></section>
<section id="calc" class="hide"><div class="panel"><h3>重量換算</h3><label>配方</label><select id="which"></select><label>雞肉重量（kg）</label><input id="kg" type="number" min=".001" step=".001" value="18"><div id="calcOut"></div><button class="primary" id="toBatch">建立批次</button></div></section>
<section id="batches" class="hide"><div class="row"><h3>生產批次</h3><button class="primary" id="newBatch">新增批次</button></div><div id="batchList"></div></section>
<section id="stock" class="hide"><div class="row"><h3>原料庫存</h3><button class="primary" id="addStock">新增原料</button></div><div class="panel" id="stockList"></div><p class="muted">單位需與配方原料一致（g 或 kg）；正式版將加入採購、盤點與單位轉換稽核。</p></section>
<section id="backup" class="hide"><div class="panel"><h3>批次 PDF 報表</h3><select id="report"></select><button class="primary" id="pdf">列印／另存 PDF</button></div><div class="panel"><h3>資料備份</h3><button class="primary" id="export">匯出 JSON</button><label>匯入 JSON<input id="import" type="file" accept=".json,application/json"></label></div></section>
</main><script>
const original=[
{id:'R001',name:'紅麴豆乳雞－甜菜根粉版',version:'歷史紀錄／18kg基準',base:18,groups:[{name:'濕料',items:[['紅麴豆腐乳',200,'g'],['醬油',15,'g'],['米酒',105,'g'],['沙拉油',36,'g'],['醋',5,'g']]},{name:'乾料／粉漿',items:[['豆漿粉',60,'g'],['蒜粉',53,'g'],['砂糖',45,'g'],['白胡椒',18,'g'],['甜菜根粉',5,'g'],['磷酸鈉或林寶粉',5,'g'],['中筋麵粉',150,'g'],['地瓜粉',450,'g'],['玉米粉',300,'g'],['冰水',180,'g'],['CMC',1.8,'g']]}],note:'已知最新18kg摘要；原文「磷酸鈉5g或林寶粉」保留歧義。'},
{id:'R002',name:'檸檬雞－熟黃豆粉版',version:'2026-10-05原始紀錄',base:17,groups:[{name:'醃料（未加水）',items:[['米酒',255,'g'],['醬油',50,'g'],['檸檬酸',51,'g'],['砂糖',204,'g'],['鹽',136,'g'],['熟黃豆粉',60,'g'],['蒜粉',51,'g'],['白胡椒粉',17,'g']]}],note:'原始紀錄明確註記：醃料階段沒有加水。每17kg翅腿。'}
];
let db=JSON.parse(localStorage.getItem('mmdb')||'null')||{recipes:original,batches:[],stock:[]},calc=null;
const $=id=>document.getElementById(id),save=()=>{localStorage.setItem('mmdb',JSON.stringify(db));render()},fmt=n=>Number(n.toFixed(4));
document.querySelector('.tabs').onclick=e=>{let b=e.target.closest('[data-p]');if(!b)return;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('main section').forEach(x=>x.classList.toggle('hide',x.id!==b.dataset.p));};
function render(){ $('nr').textContent=db.recipes.length;$('nb').textContent=db.batches.length;$('ns').textContent=db.stock.length;$('latest').textContent=db.batches.length?'最近批次：'+db.batches.at(-1).code+'／'+db.batches.at(-1).status:'尚無生產紀錄';$('recipeList').innerHTML=db.recipes.map((r,i)=>'<div class="recipe"><b>'+r.name+'</b> <span class="tag">'+r.version+'</span><p class="muted">基準 '+r.base+'kg</p><button onclick="view('+i+')">查看原始數據</button> <button onclick="clone('+i+')">另存新版本</button></div>').join('');$('which').innerHTML=db.recipes.map(r=>'<option value="'+r.id+'">'+r.name+'｜'+r.version+'</option>').join('');$('stockList').innerHTML=db.stock.length?'<table><tr><th>原料</th><th>庫存</th><th>單位</th><th>單價</th></tr>'+db.stock.map(s=>'<tr><td>'+s.name+'</td><td>'+s.qty+'</td><td>'+s.unit+'</td><td>'+s.price+'</td></tr>').join('')+'</table>':'<p class="muted">尚無原料庫存</p>';$('batchList').innerHTML=db.batches.map(b=>'<div class="recipe"><b>'+b.code+'</b><p class="muted">'+b.name+'／'+b.kg+'kg／'+b.status+'</p><button onclick="finish(\''+b.id+'\')">完成並扣庫存</button> <button onclick="batchPDF(\''+b.id+'\')">報表</button></div>').join('')||'<p class="muted">尚無批次</p>';$('report').innerHTML=db.batches.map(b=>'<option value="'+b.id+'">'+b.code+'</option>').join('');calculate();}
window.view=i=>{let r=db.recipes[i];$('recipeView').innerHTML='<div class="panel"><h3>'+r.name+'｜'+r.version+'</h3>'+r.groups.map(g=>'<div class="group">'+g.name+'</div><table>'+g.items.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+' '+x[2]+'</td></tr>').join('')+'</table>').join('')+'<p class="warn">'+r.note+'</p></div>'};
window.clone=i=>{let r=JSON.parse(JSON.stringify(db.recipes[i]));r.id='R'+Date.now();r.version='新版本（複製自 '+r.version+'）';r.name+='（新版本）';db.recipes.push(r);save()};
$('newRecipe').onclick=()=>{let name=prompt('配方名稱');if(!name)return;let base=+prompt('雞肉基準重量 kg','18');if(!(base>0))return;db.recipes.push({id:'R'+Date.now(),name,version:'v1',base,groups:[{name:'原料',items:[]}],note:'新建配方，原料待填。'});save()};
function calculate(){let r=db.recipes.find(x=>x.id===$('which').value),kg=+$('kg').value;if(!r||!(kg>0))return;calc={r,kg,groups:r.groups.map(g=>({name:g.name,items:g.items.map(x=>[x[0],x[1]*kg/r.base,x[2]])}))};$('calcOut').innerHTML='<p class="muted">換算倍率 '+(kg/r.base).toFixed(6)+' 倍；僅計算，不修改原始配方。</p>'+calc.groups.map(g=>'<div class="group">'+g.name+'</div><table>'+g.items.map(x=>'<tr><td>'+x[0]+'</td><td>'+fmt(x[1])+' '+x[2]+'</td></tr>').join('')+'</table>').join('')}
$('kg').oninput=calculate;$('which').onchange=calculate;
function createBatch(){if(!calc)return;let b={id:'B'+Date.now(),code:'MM-'+Date.now(),name:calc.r.name,version:calc.r.version,kg:calc.kg,groups:calc.groups,status:'準備中',date:new Date().toISOString().slice(0,10),cost:null};db.batches.push(b);save();alert('已建立批次 '+b.code)}
$('toBatch').onclick=createBatch;$('newBatch').onclick=()=>{let r=db.recipes[0],kg=+prompt('雞肉重量 kg',r.base);if(!(kg>0))return;calc={r,kg,groups:r.groups.map(g=>({name:g.name,items:g.items.map(x=>[x[0],x[1]*kg/r.base,x[2]])}))};createBatch()};
$('addStock').onclick=()=>{let name=prompt('原料名稱');if(!name)return;let unit=prompt('單位 g 或 kg','g');if(!['g','kg'].includes(unit))return alert('單位請輸入 g 或 kg');db.stock.push({name,unit,qty:+prompt('目前庫存量','0'),price:+prompt('每單位成本（元）','0')});save()};
window.finish=id=>{let b=db.batches.find(x=>x.id===id);if(b.status==='已完成')return alert('已完成，不重複扣料');let needs=[];b.groups.forEach(g=>g.items.forEach(x=>{let s=db.stock.find(y=>y.name===x[0]);if(!s||s.qty<x[1])needs.push(x[0])}));if(needs.length)return alert('缺少庫存或數量不足：'+[...new Set(needs)].join('、'));b.groups.forEach(g=>g.items.forEach(x=>db.stock.find(y=>y.name===x[0]).qty-=x[1]));b.status='已完成';save()};
function batchPDF(id){let b=db.batches.find(x=>x.id===id);let w=window.open('','_blank');w.document.write('<meta charset="utf-8"><h2>醃製生產批次報表</h2><p>'+b.code+'｜'+b.date+'｜'+b.name+'｜'+b.kg+'kg</p>'+b.groups.map(g=>'<h3>'+g.name+'</h3><table border="1" cellpadding="7">'+g.items.map(x=>'<tr><td>'+x[0]+'</td><td>'+fmt(x[1])+' '+x[2]+'</td></tr>').join('')+'</table>').join('')+'<p>配方版本：'+b.version+'</p><script>onload=()=>print()<\/script>');w.document.close()}
$('pdf').onclick=()=>batchPDF($('report').value);$('export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='MarinadeMaster-backup.json';a.click();URL.revokeObjectURL(u)};
$('import').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!x.recipes||!x.batches||!x.stock)throw 0;if(confirm('匯入會取代目前資料，確定？')){db=x;save()}}catch{alert('備份檔格式錯誤')}};rd.readAsText(f)};
render();
</script></body></html>
